[build]
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML pages - cache briefly, revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Trailing slash normalization
[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/tools"
  to = "/tools/"
  status = 301

# 301 redirect for duplicate content consolidation (April 20, 2026)
[[redirects]]
  from = "/blog/is-pmp-worth-it-2026"
  to = "/blog/is-pmp-exam-worth-it-2026"
  status = 301
  force = true

# 301 redirect: orphan tools index duplicate -> canonical /tools/ (cleanup Jul 2026)
[[redirects]]
  from = "/tools/tools-index"
  to = "/tools/"
  status = 301
  force = true

# 301 redirect: EVM formulas post consolidated into the EVM formulas and calculator page (Sep 2026)
[[redirects]]
  from = "/blog/pmp-evm-formulas-explained"
  to = "/tools/evm-calculator"
  status = 301
  force = true

# App routes requested on the marketing domain -> the app (Sep 2026).
# Googlebot extracts these paths from the GA tracking script in index.html and
# resolves them against pmmastery.app, producing 404s. These also catch anyone
# who types or shares the app URL without the app. subdomain. Netlify preserves
# query strings, so UTM params survive the hop.
[[redirects]]
  from = "/try"
  to = "https://app.pmmastery.app/try"
  status = 301

[[redirects]]
  from = "/auth/*"
  to = "https://app.pmmastery.app/auth/:splat"
  status = 301
